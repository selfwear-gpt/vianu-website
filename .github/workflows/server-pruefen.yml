name: Drei große Container-Logs leeren

# Nur von Hand startbar. Leert ausschließlich die Log-Dateien der Container vianu-server-worker-1,
# vianu-server-worker-production-1 und vianu-server-dashboard-1 (truncate, die Container laufen weiter).
# Gibt nur Größen und Zustände aus, keine Log-Inhalte. Das Repo ist öffentlich, die Logs auch.
# Einmalige Aktion, wird danach wieder entfernt.
on:
  workflow_dispatch:

concurrency:
  group: server-pflege
  cancel-in-progress: false

jobs:
  leeren:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Logs leeren
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            NAMEN="vianu-server-worker-1 vianu-server-worker-production-1 vianu-server-dashboard-1"
            groesse() { for n in $NAMEN; do id=$(docker inspect -f '{{.Id}}' $n); echo "$n $(sudo -n stat -c %s /var/lib/docker/containers/$id/$id-json.log) Byte"; done; }
            echo "=== vorher ==="
            groesse
            df -h / | tail -1
            echo
            for n in $NAMEN; do
              id=$(docker inspect -f '{{.Id}}' $n)
              sudo -n truncate -s 0 "/var/lib/docker/containers/$id/$id-json.log" && echo "geleert: $n"
            done
            echo
            echo "=== nachher ==="
            groesse
            df -h / | tail -1
            echo
            echo "=== Container ==="
            docker ps -a --format '{{.Names}}: {{.Status}}'
