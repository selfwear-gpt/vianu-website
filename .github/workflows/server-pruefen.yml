name: Container-Logs prüfen (nur Größen)

# Nur von Hand startbar, ändert und löscht nichts. Zeigt Container-Namen mit der Größe ihrer Log-Datei.
# Gibt keine Log-Inhalte aus. Das Repo ist öffentlich, die Logs auch.
on:
  workflow_dispatch:

concurrency:
  group: server-pflege
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Größen lesen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Container und Größe ihrer Log-Dateien ==="
            for c in $(docker ps -aq); do
              id=$(docker inspect -f '{{.Id}}' $c)
              n=$(docker inspect -f '{{.Name}}' $c)
              sz=$(sudo -n du -sh /var/lib/docker/containers/$id/$id-json.log 2>/dev/null | cut -f1)
              echo "$sz  $n"
            done | sort -hr
            df -h / | tail -1
