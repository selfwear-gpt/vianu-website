name: Postgres prüfen (nur lesen)

# Nur von Hand startbar, ändert nichts. Liest Zustand, Neustartgrund und gefilterte Fehlerzeilen des
# Postgres-Containers. Das Repo ist öffentlich, die Logs auch: Zeilen werden gefiltert und geschwärzt,
# der Lauf wird nach dem Lesen gelöscht.
on:
  workflow_dispatch:

concurrency:
  group: server-pflege
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Postgres lesen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            C=$(docker ps -aq --filter name=postgres | head -1)
            red() { sed -E 's/(user|role|database) "[^"]*"/\1 "***"/g; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g'; }
            echo "=== Platte ==="; df -h / | tail -1
            echo
            echo "=== Zustand ==="
            docker inspect -f 'Status={{.State.Status}} Exit={{.State.ExitCode}} OOM={{.State.OOMKilled}} Neustarts={{.RestartCount}} Policy={{.HostConfig.RestartPolicy.Name}}' $C
            docker inspect -f 'Gestartet={{.State.StartedAt}} Beendet={{.State.FinishedAt}} Fehler={{.State.Error}}' $C | red
            docker inspect -f 'Image={{.Config.Image}}' $C | sed -E 's#[^ =]*/##'
            echo
            echo "=== Mounts ==="
            docker inspect -f '{{range .Mounts}}{{.Type}} {{.Destination}}{{"\n"}}{{end}}' $C
            V=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Source}}{{end}}{{end}}' $C)
            [ -z "$V" ] && V=$(docker inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Source}}{{end}}{{end}}' $C)
            echo "Datenordner-Größe: $(sudo -n du -sh "$V" 2>&1 | cut -f1)"
            echo "PG_VERSION im Datenordner: $(sudo -n cat "$V/PG_VERSION" 2>&1 | head -1)"
            echo
            echo "=== Fehlerzeilen der letzten 2000 Logzeilen (gefiltert, gezählt) ==="
            docker logs --tail 2000 $C 2>&1 | grep -E 'FATAL|ERROR|PANIC|HINT|DETAIL|could not|permission|No space|corrupt|incompatible|initdb|lock file|invalid|database system|exited|shut' | red | cut -c1-190 | sed -E 's/^[0-9: .-]*(UTC)? *//' | sort | uniq -c | sort -rn | head -15
            echo
            echo "=== Lauschende Ports (nur Nummern) ==="
            ss -ltnH 2>/dev/null | awk '{print $4}' | sed 's/.*://' | sort -un | tr '\n' ' '; echo
